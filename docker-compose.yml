services:
  # ===========================================
  # Frontend (Caddy + Vue 3 build)
  # ===========================================
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: meu-regional-frontend
    ports:
      - "7000:7000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.50'
        reservations:
          memory: 32M
    restart: unless-stopped

  # ===========================================
  # Backend API
  # ===========================================
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: meu-regional-backend
    volumes:
      - backend_data:/app/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-in-production}
      - DATABASE_PATH=/app/data/meu-regional.db
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'
        reservations:
          memory: 128M
    restart: unless-stopped

volumes:
  backend_data:
